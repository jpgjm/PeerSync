org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# iOS targets are disabled on non-macOS hosts (the framework is built by Xcode's
# preBuildScripts via linkReleaseFrameworkIosArm64)
kotlin.native.ignoreDisabledTargets=true
# Suppress the "Cross Compilation with Cinterop Not Supported" warning on Windows/Linux
# (harmless: iOS klibs are only built on macOS)
kotlin.native.enableKlibsCrossCompilation=false
# Note: do not use compose.desktop.application.downloadWix=false (tried in 0.2.9; it failed).
# Compose plugin 1.9.3 always reads wixToolsetDir on Windows, even for AppImage, so
# downloadWix=false without the WIX_PATH env variable makes createDistributable fail with
# "property 'wixToolsetDir' because it has no value available".
# CI avoids the WiX download (GitHub 504) via WIX_PATH (see build-windows-portable.yml).
# App name and version (0.2.30+; managed in one place).
# Read by Android: display name (${appName} in the manifest), versionName, versionCode;
# Windows: packageName, packageVersion; and CI artifact names (build-apk / build-windows-portable).
# Runtime code uses AppInfo.NAME in shared (Kotlin constants can't come from build settings, so keep values in sync).
# iOS version is CFBundleShortVersionString in project.yml (XcodeGen can't read gradle.properties).
peersync.appName=PeerSync
peersync.version=0.2.38
peersync.versionCode=46
